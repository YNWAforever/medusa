services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fotomax
      POSTGRES_USER: fotomax
      POSTGRES_PASSWORD: fotomax_local_only
    ports:
      - "5432:5432"
    volumes:
      - fotomax-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fotomax -d fotomax"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - fotomax-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fotomax_minio
      MINIO_ROOT_PASSWORD: fotomax_minio_local_only
      MINIO_API_CORS_ALLOW_ORIGIN: http://127.0.0.1:3100,http://localhost:3100
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - fotomax-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set fotomax http://minio:9000 fotomax_minio fotomax_minio_local_only
        mc mb --ignore-existing fotomax/fotomax-photo-private
        mc anonymous set none fotomax/fotomax-photo-private
        exec tail -f /dev/null

volumes:
  fotomax-postgres-data:
  fotomax-redis-data:
  fotomax-minio-data:
