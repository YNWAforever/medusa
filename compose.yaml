services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fotomax
      POSTGRES_USER: fotomax
      POSTGRES_PASSWORD: fotomax_local_only
    ports:
      - "5432:5432"
    volumes:
      - fotomax-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fotomax -d fotomax"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    volumes:
      - fotomax-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fotomax-postgres-data:
  fotomax-redis-data:
